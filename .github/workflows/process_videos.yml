name: SHADHW Video Processor

on:
  workflow_dispatch:
  push:
    paths:
      - products.json

permissions:
  contents: write

jobs:
  process-videos:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-video.txt

      - name: Install FFmpeg
        run: choco install ffmpeg -y

      - name: Check FFmpeg
        run: ffmpeg -version

      - name: Process videos
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          FFMPEG_PATH: ffmpeg
          PYTHONIOENCODING: utf-8
        run: python -X utf8 video_processor.py

      - name: Save processing state
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add processed_videos.json

          if (-not (git diff --cached --quiet)) {
            git commit -m "Update processed video state"
            git push
          }
```
