<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SHADHW JEWELS | شَذْو للمجوهرات</title>

    <meta name="description" content="شَذْو للمجوهرات | SHADHW JEWELS">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="site-header">

    <div class="header-inner">

        <a href="index.html" class="logo">
            <span class="logo-ar">شَذْو</span>
            <span class="logo-en">SHADHW JEWELS</span>
        </a>

        <button class="cart-button" id="cartButton">
            🛒
            <span>السلة</span>
            <b id="cartCount">0</b>
        </button>

    </div>

</header>


<main>

    <section class="hero">

        <div class="hero-content">

            <p class="hero-small">SHADHW JEWELS</p>

            <h1>اختاري القطعة اللي كتشبه ليك ✨</h1>

            <p>
                اكتشفي تشكيلتنا واختاري القطعة المناسبة لذوقك.
            </p>

            <a href="#products" class="hero-button">
                اكتشفي المنتجات
            </a>

        </div>

    </section>


    <section class="products-section" id="products">

        <div class="section-heading">

            <div>
                <span>SHADHW JEWELS</span>
                <h2>منتجاتنا</h2>
            </div>

            <div class="products-info">
                <span id="productsCount">جاري تحميل المنتجات...</span>
            </div>

        </div>


        <div class="store-controls">

            <div class="search-box">

                <input
                    type="search"
                    id="searchInput"
                    placeholder="قلب على منتج..."
                    autocomplete="off"
                >

                <span>⌕</span>

            </div>

        </div>


        <div id="productsGrid" class="products-grid">

            <div class="loading">
                جاري تحميل المنتجات...
            </div>

        </div>


        <div id="emptyMessage" class="empty-message hidden">

            <h3>ما لقيناش هاد المنتج</h3>

            <p>
                جرب كلمة أخرى في البحث.
            </p>

        </div>

    </section>

</main>


<!-- CART -->

<div id="cartOverlay" class="cart-overlay hidden">

    <div class="cart">

        <div class="cart-header">

            <h2>السلة</h2>

            <button id="closeCart">×</button>

        </div>


        <div id="cartItems" class="cart-items"></div>


        <div class="cart-footer">

            <div class="cart-total">

                <span>المجموع</span>

                <strong id="cartTotal">0 DH</strong>

            </div>

            <button id="whatsappOrder" class="whatsapp-button">
                الطلب عبر واتساب
            </button>

        </div>

    </div>

</div>


<script src="js/store.js"></script>

</body>
</html>
