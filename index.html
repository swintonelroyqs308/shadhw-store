<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شَذْو للمجوهرات | SHADHW JEWELS</title>
    <meta name="description" content="شَذْو للمجوهرات | SHADHW JEWELS">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
    <div class="header-inner">
        <a href="index.html" class="brand" aria-label="SHADHW JEWELS">
            <img src="assets/logo-shadhw.png" alt="شَذْو للمجوهرات" class="brand-logo">
        </a>
        <button class="cart-button" id="cartButton" type="button" aria-label="فتح السلة">
            <span class="cart-icon">🛒</span>
            <span>السلة</span>
            <b id="cartCount">0</b>
        </button>
    </div>
</header>

<main>
    <section class="hero">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <span class="eyebrow">SHADHW JEWELS</span>
            <h1>اختاري القطعة اللي كتشبه ليك ✨</h1>
            <p>تفاصيل مختارة بعناية باش تلقاي القطعة اللي كتكمّل الستايل ديالك.</p>
            <a href="#products" class="hero-button">اكتشفي المجموعة</a>
        </div>
    </section>

    <section class="products-section" id="products">
        <div class="section-heading">
            <div>
                <span class="section-kicker">SHADHW JEWELS</span>
                <h2>المجموعة</h2>
            </div>
            <span id="productsCount" class="products-count">جاري تحميل المنتجات...</span>
        </div>

        <div class="store-controls">
            <label class="search-box" aria-label="البحث عن منتج">
                <input type="search" id="searchInput" placeholder="قلّبي على قطعة..." autocomplete="off">
                <span>⌕</span>
            </label>
        </div>

        <div id="productsGrid" class="products-grid">
            <div class="loading">جاري تحميل المنتجات...</div>
        </div>

        <div id="emptyMessage" class="empty-message hidden">
            <div class="empty-icon">✦</div>
            <h3>ما لقيناش هاد القطعة</h3>
            <p>جربي كلمة أخرى في البحث.</p>
        </div>
    </section>
</main>

<div id="cartOverlay" class="cart-overlay hidden" aria-hidden="true">
    <div class="cart-backdrop" id="cartBackdrop"></div>
    <aside class="cart" aria-label="سلة المشتريات">
        <div class="cart-header">
            <div>
                <span class="section-kicker">SHADHW JEWELS</span>
                <h2>السلة</h2>
            </div>
            <button id="closeCart" type="button" aria-label="إغلاق السلة">×</button>
        </div>
        <div id="cartItems" class="cart-items"></div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>المجموع</span>
                <strong id="cartTotal">0 DH</strong>
            </div>
            <button id="whatsappOrder" class="whatsapp-button" type="button">إتمام الطلب عبر واتساب</button>
        </div>
    </aside>
</div>

<script src="js/store.js"></script>
</body>
</html>
